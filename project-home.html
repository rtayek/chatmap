<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DotMDfiles project</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      font-size: 22px;
      background: #05090d;
      color: #ffffff;
    }

    body {
      max-width: 48rem;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      margin-top: 0;
      font-size: 2.25rem;
    }

    p {
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 1rem;
      margin: 2rem 0;
    }

    a,
    button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 3.25rem;
      padding: 0.8rem 1rem;
      border: 3px solid #63dcff;
      border-radius: 0.5rem;
      background: #102f46;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    a:hover,
    button:hover,
    a:focus-visible,
    button:focus-visible {
      background: #174c70;
      outline: 4px solid #ffe600;
      outline-offset: 3px;
    }

    button {
      background: #ffe600;
      color: #000000;
    }

    #status {
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <main>
    <h1>ChatMap project</h1>
    <p>Open the web resources used for work on the dotfiles repository.</p>
    <p><strong>Tip:</strong> Hold Ctrl while selecting each link to open it in a background tab.</p>

    <div class="links" id="links"></div>

    <button type="button" id="open-all">Open all project tabs</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const projectLinks = [
      { name: "ChatGPT", url: "https://chatgpt.com/" },
      { name: "Claude", url: "https://claude.ai/" },
      { name: "Gemini", url: "https://gemini.google.com/app" },
      { name: "GitHub", url: "https://github.com/rtayek/chatmap" }
    ];

    const links = document.querySelector("#links");
    const status = document.querySelector("#status");

    for (const projectLink of projectLinks) {
      const link = document.createElement("a");
      link.href = projectLink.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = projectLink.name;
      links.append(link);
    }

    document.querySelector("#open-all").addEventListener("click", () => {
      let opened = 0;

      for (const projectLink of projectLinks) {
        if (window.open(projectLink.url, "_blank", "noopener,noreferrer")) {
          opened += 1;
        }
      }

      status.textContent = opened === projectLinks.length
        ? `Opened ${opened} project tabs.`
        : `Opened ${opened} of ${projectLinks.length} tabs. Use the individual links or allow pop-ups for this page.`;
    });
  </script>
</body>
</html>
